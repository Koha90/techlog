[package]
name = "techlog"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
chrono = "0.4.45"
docx-rs = "0.4.22"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
tempfile = "3.27.0"
zip = "8"
